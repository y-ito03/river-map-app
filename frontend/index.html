<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>川の調査マップ</title>
</head>
<body>
  <div id="app">
    <div id="access-gate" class="modal hidden">
      <div class="modal-content access-content">
        <h2>アクセスできません</h2>
        <p>このアプリは、配布されたQRコードからアクセスした人だけが使えます。</p>
        <p>先生から配られたQRコードをもう一度読み取ってください。</p>
      </div>
    </div>

    <!-- 投稿ウィザードの画面（最初は隠れています） -->
    <div id="wizard-modal" class="modal hidden">
      <div class="modal-content">
        <button id="close-wizard" class="close-btn">✖ やめる</button>
        <p id="wizard-target-label" class="wizard-target-label"></p>
        
        <div id="step-1" class="wizard-step active">
          <h3>なまえ（ニックネーム）を おしえてね</h3>
          <input type="text" id="input-nickname" class="large-input" placeholder="ニックネームを入力">
          <div class="btn-area"><button class="next-btn" data-next="2">つぎへ</button></div>
        </div>

        <div id="step-2" class="wizard-step hidden">
          <h3>どのいきものを みつけた？</h3>
          <div class="creature-grid">
            <button class="creature-btn" data-name="アカハライモリ">アカハライモリ</button>
            <button class="creature-btn" data-name="サワガニ">サワガニ</button>
            <button class="creature-btn" data-name="ハグロトンボ">ハグロトンボ</button>
            <button class="creature-btn" data-name="コオニヤンマ">コオニヤンマ</button>
            <button type="button" class="creature-btn" data-name="その他">その他</button>
          </div>
          <div class="btn-area"><button class="prev-btn" data-prev="1">もどる</button></div>
        </div>

        <div id="step-3" class="wizard-step hidden">
          <h3>かいた え や、しゃしん を えらんでね</h3>
          <input type="file" id="input-image" accept="image/*" class="large-input">
          <img id="preview-image" style="max-width: 100%; max-height: 200px; display: none; margin-top: 10px; border-radius: 8px;">
          <h3>概念図があれば えらんでね</h3>
          <input type="file" id="input-concept-image" accept="image/*" class="large-input">
          <img id="preview-concept-image" style="max-width: 100%; max-height: 200px; display: none; margin-top: 10px; border-radius: 8px;">
          <div class="btn-area">
            <button class="prev-btn" data-prev="2">もどる</button>
            <button class="next-btn" data-next="4">つぎへ</button>
          </div>
        </div>

        <div id="step-4" class="wizard-step hidden">
          <h3>コメントを かいてね（きづいたことなど）</h3>
          <textarea id="input-comment" class="large-input" rows="4" placeholder="どんなところにいた？ なにをしていた？"></textarea>
          <div class="btn-area">
            <button class="prev-btn" data-prev="3">もどる</button>
            <button class="next-btn" data-next="5">かくにん</button>
          </div>
        </div>

        <div id="step-5" class="wizard-step hidden">
          <h3>これで とうろく する？</h3>
          <div class="confirm-box">
            <p><b>なまえ:</b> <span id="confirm-nickname"></span></p>
            <p><b>いきもの:</b> <span id="confirm-creature"></span></p>
            <p><b>コメント:</b> <span id="confirm-comment"></span></p>
            <p><b>かいた え・しゃしん:</b></p>
            <img id="confirm-image" style="max-width: 100%; max-height: 150px; border-radius: 8px;">
            <p><b>概念図:</b></p>
            <img id="confirm-concept-image" style="max-width: 100%; max-height: 150px; border-radius: 8px;">
          </div>
          <div class="btn-area">
            <button class="prev-btn" data-prev="4">もどる</button>
            <button id="submit-btn" class="submit-btn">とうろく</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ヘッダーとハンバーガーメニュー -->
    <header class="header">
      <button id="menu-btn" class="menu-btn" aria-label="メニューを開く">☰</button>
      <h1 class="title">岩倉川の調査記録</h1>
    </header>

    <nav id="sidebar" class="sidebar hidden">
      <ul>
        <li><button class="nav-btn group-btn" data-group="group1">1班の記録</button></li>
        <li><button class="nav-btn group-btn" data-group="group2">2班の記録</button></li>
        <li><button id="btn-heatmap" class="nav-btn">ヒートマップモード</button></li>
        <li><button id="btn-reload" class="nav-btn">最新状態にする</button></li>
      </ul>
    </nav>

    <!-- メインコンテナ（地図 2/3 + パネル 1/3） -->
    <div id="main-container">
      <div id="map"></div>
      
      <!-- サイドパネル -->
      <aside id="detail-panel" class="detail-panel hidden">
        <div class="panel-header">
          <h2 id="panel-title">ポイント詳細</h2>
          <button id="close-panel" class="close-btn-panel">✖ 閉じる</button>
        </div>
        <div id="panel-content" class="panel-content">
          <p class="placeholder-text">ポイントを選択してください</p>
        </div>
      </aside>
    </div>

    <!-- ヒートマップモード用の集計パネル -->
    <div id="summary-panel" class="summary-panel hidden">
      <h3> 生物数</h3>
      <!-- 【追加】絞り込み用のドロップダウン -->
      <select id="heatmap-filter" class="heatmap-filter"></select>
      <ul id="summary-list"></ul>
    </div>

  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
