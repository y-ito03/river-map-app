<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岩倉川の調査記録 管理画面</title>
</head>
<body>
  <div id="admin-app">
    <header class="admin-header">
      <div>
        <h1>管理画面</h1>
        <p>岩倉川の調査記録</p>
      </div>
      <button id="logout-btn" class="secondary-btn hidden">コードを消す</button>
    </header>

    <main class="admin-main">
      <section id="login-panel" class="admin-panel">
        <h2>管理用コード</h2>
        <p>先生用の管理コードを入力してください。</p>
        <div class="login-row">
          <input id="admin-code-input" type="password" autocomplete="current-password" placeholder="管理用コード">
          <button id="save-code-btn">入る</button>
        </div>
        <p id="login-message" class="message"></p>
      </section>

      <nav id="admin-tabs" class="admin-tabs hidden" aria-label="管理メニュー">
        <button type="button" class="tab-btn active" data-view="posts">投稿管理</button>
        <button type="button" class="tab-btn" data-view="detections">AI検出候補</button>
      </nav>

      <section id="posts-panel" class="hidden">
        <div class="toolbar">
          <div class="filter-group">
            <select id="status-filter" aria-label="表示状態">
              <option value="all">すべて</option>
              <option value="visible">表示中</option>
              <option value="hidden">非表示</option>
            </select>
            <select id="type-filter" aria-label="投稿の種類">
              <option value="all">すべての投稿</option>
              <option value="detection">ピンへの投稿</option>
              <option value="free">えらんだ場所の投稿</option>
            </select>
          </div>
          <button id="reload-btn">再読み込み</button>
        </div>

        <p id="summary-text" class="summary-text"></p>
        <div id="posts-list" class="posts-list"></div>
      </section>

      <section id="detections-panel" class="hidden">
        <section class="admin-panel selected-image-panel">
          <h2>地上画像・水中画像を追加</h2>
          <p>班または日付ごとに表示する「地上の様子」「水中の様子」を追加・差し替えできます。</p>
          <form id="selected-image-form" class="selected-image-form">
            <label>
              記録
              <select id="selected-image-group" name="group_id" required>
                <option value="">記録を選ぶ</option>
              </select>
            </label>
            <label>
              画像の種類
              <select id="selected-image-type" name="type" required>
                <option value="ground">地上の様子</option>
                <option value="underwater">水中の様子</option>
              </select>
            </label>
            <label>
              画像
              <input id="selected-image-file" name="image" type="file" accept="image/*" required>
            </label>
            <div class="form-actions">
              <button type="submit">画像を保存</button>
              <button id="delete-selected-image-btn" type="button" class="secondary-btn">画像を削除</button>
              <span id="selected-image-message" class="form-message"></span>
            </div>
          </form>
        </section>

        <section class="admin-panel add-detection-panel">
          <h2>検出候補を追加</h2>
          <p>AIがうまく見つけられなかった候補を、班または日付の記録に手動で追加できます。場所を指定しない場合は、記録の中央あたりに追加されます。</p>
          <form id="add-detection-form" class="add-detection-form">
            <label>
              記録
              <select id="add-detection-group" name="group_id" required>
                <option value="">記録を選ぶ</option>
              </select>
            </label>
            <label>
              候補名
              <select id="add-detection-class" name="class_name" required>
                <option value="">生物名を選ぶ</option>
              </select>
            </label>
            <label>
              参考画像
              <input id="add-detection-thumbnail" name="thumbnail" type="file" accept="image/*">
            </label>
            <details class="advanced-fields">
              <summary>場所や時刻を細かく指定する</summary>
              <div class="advanced-field-grid">
                <label>
                  緯度
                  <input id="add-detection-lat" name="lat" type="number" step="any" placeholder="空欄で自動">
                </label>
                <label>
                  経度
                  <input id="add-detection-lng" name="lng" type="number" step="any" placeholder="空欄で自動">
                </label>
                <label>
                  動画内の秒数
                  <input id="add-detection-time" name="timestamp_sec" type="number" step="0.01" placeholder="任意">
                </label>
              </div>
            </details>
            <div class="form-actions">
              <button type="submit">候補を追加</button>
              <span id="add-detection-message" class="form-message"></span>
            </div>
          </form>
        </section>

        <div class="toolbar">
          <div class="filter-group">
            <select id="detection-status-filter" aria-label="検出候補の表示状態">
              <option value="all">すべて</option>
              <option value="visible">表示中</option>
              <option value="hidden">非表示</option>
            </select>
            <select id="detection-group-filter" aria-label="班">
              <option value="all">すべての班</option>
            </select>
          </div>
          <button id="reload-detections-btn">再読み込み</button>
        </div>

        <p id="detection-summary-text" class="summary-text"></p>
        <div id="detections-list" class="detections-list"></div>
      </section>
    </main>
  </div>

  <script type="module" src="/admin.js"></script>
</body>
</html>
